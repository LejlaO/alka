# On every push and pull request: the whole repository is built, and the release profile (sources jars, javadoc jars) is tried without signing, so that it cannot rot.
name: build

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and install
        run: mvn -B install
      - name: The release profile, without signing
        run: mvn -B -Prelease -Dgpg.skip=true clean verify

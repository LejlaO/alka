# On a version tag (v0.1.0, v0.2.0-rc1, ...): the tag must be the version of the poms; everything is built, signed and uploaded to the Central Portal as a bundle that
# is validated and then WAITS for you to click Publish (autoPublish is false in the pom). A release page is made for the tag; the package (the zips) is attached to it
# by the workflow of the private repository alka-engine, which is started by a tag of the same name.
# Needs these secrets in the settings of this repository: CENTRAL_USERNAME, CENTRAL_PASSWORD (the user token of the Central Portal), GPG_PRIVATE_KEY (the signing key,
# exported as text) and GPG_PASSPHRASE. See RELEASING.md.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: The tag must be the version of the poms
        run: |
          VERSION="$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME is not v$VERSION, the version of the poms. Set the version with set-version.ps1, commit, and tag again."
            exit 1
          fi
      - name: Build, sign and upload to the Central Portal (validated, not published)
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -Prelease clean deploy
      - name: The release page of the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            FLAG=""
            case "$GITHUB_REF_NAME" in *-*) FLAG="--prerelease";; esac
            {
              echo "Alka $VERSION."
              echo
              echo "**Download \`alka-$VERSION.zip\`** and unzip it: it is the package with the Studio, the engine and a demo service. Start \`studio.bat\` (Windows) or \`./studio.sh\`. You need Java 21 or newer."
              echo
              echo "- \`alka-$VERSION-home.zip\` is only the home folder (engine, config, demo) without the Studio. You need it only if you already have a Studio."
              echo "- \`SHA256SUMS.txt\` has the checksums of the two zips, to check that a download is whole."
              echo "- \"Source code\" is added by GitHub: the source of the public repository at this version. You do not need it to run Alka."
              echo
              echo "The libraries (the API, the parent pom, the Maven plugin, the project generator) are not here: they are on Maven Central as com.alkadev:*:$VERSION, and Maven fetches them. More in the README."
            } > release-notes.md
            gh release create "$GITHUB_REF_NAME" --title "Alka $VERSION" --notes-file release-notes.md $FLAG
          fi

# The service ${rootArtifactId}: one manager and one plugin that talks to it. This file says what the service has and how it is wired.
#   alkaprocessor.manager.<name>       = <jar>                      a manager instance (the jar is in libs/override/${rootArtifactId}/plugin)
#   alkaprocessor.plugin.<name>        = <jar>                      a plugin instance
#   alkaprocessor.addmanager.<plugin>  = <manager>,<manager>...     the managers a plugin may use
#   alkaprocessor.map.<plugin>         = <plugin>,<plugin>...       the plugins that receive what a plugin sends on
# The settings of an instance are in config/plugins/${rootArtifactId}/plugins/<name>.properties and config/plugins/${rootArtifactId}/managers/<name>.properties.
# The Studio edits this file too; both ways are fine.

alkaprocessor.engineJar = alkaprocessor.jar

alkaprocessor.manager.greeter = ${rootArtifactId}-manager.jar
alkaprocessor.plugin.hello = ${rootArtifactId}-plugin.jar
alkaprocessor.addmanager.hello = greeter
